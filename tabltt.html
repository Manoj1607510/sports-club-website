<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
table {
  border-collapse: collapse;
  border-spacing: 0;
  width: 100%;
  border: 1px solid #ddd;
}

th, td {
  text-align: left;
  padding: 16px;
}

tr:nth-child(even) {
  background-color: #f2f2f2;
}
</style>
</head>
<body>

<h2>Zebra Striped Table</h2>
<p>For zebra-striped tables, use the nth-child() selector and add a background-color to all even (or odd) table rows:</p>

<table>
  <tr>
    <th colspan="2">LIFE MEMBERSHIP (Members's Children Category)</th>
   
  </tr>
  <tr>
    <td>Entrance Fees &<br>Fund<br>Annual Subscription<br></td>
            
            
    <td>Rs.17,50,000/- +GST(18%) <br>Nil</td>
    
  </tr>
 
</table>

</body>
</html>
